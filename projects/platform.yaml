# Cluster-wide tools run by the platform team: Argo CD itself, Sealed Secrets.
# These apps may create cluster-scoped resources (CRDs, ClusterRoles).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Cluster-wide platform components
  sourceRepos:
    - https://github.com/hoangbeard/argocd-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
