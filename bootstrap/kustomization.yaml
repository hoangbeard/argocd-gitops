# Bootstrap: the only thing you apply by hand.
#
#   kubectl apply -k bootstrap --server-side
#
# It installs Argo CD, the AppProjects, and the root Application.
# After that, Argo CD manages everything (including itself) from Git.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  # Official Argo CD manifests, pinned to one release (non-HA).
  # To upgrade: change the version, commit, push. Argo CD upgrades itself.
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.5/manifests/install.yaml
  - ../projects
  - root-app.yaml

patches:
  - path: patches/argocd-cm.yaml
  - path: patches/argocd-cmd-params-cm.yaml
  - path: patches/argocd-rbac-cm.yaml
  - path: patches/resource-limits.yaml
